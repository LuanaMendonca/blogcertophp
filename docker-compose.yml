services:
  web:
    build: .
    container_name: blog_cake2_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: blog_cake2_db
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_senha
      POSTGRES_DB: blog_cake2
    ports:
      - "5432:5432"
    volumes:
      - postgres_cake2_data:/var/lib/postgresql/data

volumes:
  postgres_cake2_data:
